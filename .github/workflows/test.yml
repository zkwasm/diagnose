name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci
      - run: npm run check
      - if: runner.os != 'Windows'
        run: npm test
      - if: runner.os == 'Windows'
        run: npm run build
      - if: runner.os == 'Windows'
        run: node --experimental-strip-types --test test/review.test.ts test/vector.test.ts test/skill.test.ts test/skill-library.test.ts test/knowledge.test.ts test/knowledge-mcp.test.ts test/short-pairing.test.ts
      - if: runner.os == 'Linux'
        run: npm run build:site && npm run check:site
